AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  BoxSDK:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: Box
      Description: Box SDK
      ContentUri: lib
      RetentionPolicy: Retain
      CompatibleRuntimes:
        - python3.10
        - python3.11
        - python3.12
        - python3.13
Outputs:
    BoxSDK:
        Value: !Ref BoxSDK
        Export:
            Name: Layer-BoxSDK
